<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- =====================================================================
     ARCADE — ten classic arcade games, each a few blocks long.

     Built out of the MESACS 0.2a framework: the same blocks.js (the
     language), vm.js (what runs it), coder.js (the drag-and-drop editor)
     and app.css the full game uses. games.js holds the six games and
     their bugs; costumes.js draws the pixel art; boot.js is the renderer,
     the keyboard and the frame loop.
     ===================================================================== -->
<title>Arcade</title>
<meta name="description" content="Ten classic arcade games, cut down to a few blocks each. Play them and read their code.">
<link rel="stylesheet" href="app.css?v=9">
<style>
@font-face{font-family:'Space Mono';src:url('fonts/spacemono-700.woff2') format('woff2');
  font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:'Ubuntu Mono';src:url('fonts/ubuntumono-400.woff2') format('woff2');
  font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'Ubuntu Mono';src:url('fonts/ubuntumono-700.woff2') format('woff2');
  font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:'Ubuntu Mono';src:url('fonts/ubuntumono-400i.woff2') format('woff2');
  font-weight:400;font-style:italic;font-display:swap}
@font-face{font-family:'JetBrains Mono';src:url('fonts/jetbrainsmono-var.woff2') format('woff2');
  font-weight:400 700;font-style:normal;font-display:swap}

:root{--dn-ink:#f2f2ff;--dn-paper:#0b0a1c;--dn-dim:#8d8bb8}
html,body{margin:0;height:100%;overflow:hidden;background:var(--dn-paper)}
#view{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#coder{position:fixed;inset:0;z-index:60;pointer-events:none}

/* the machine's own screen: score, lives, title and GAME OVER, in real pixels */
#hud{position:fixed;z-index:55;image-rendering:pixelated;image-rendering:crisp-edges;pointer-events:none}
#hud.live{pointer-events:auto;cursor:pointer}

/* ------------------------------------------------------------- the bar */
#dino{position:fixed;inset:0;z-index:56;pointer-events:none;font-family:var(--font)}
#bsTop{position:absolute;left:14px;right:14px;top:14px;pointer-events:none}
#dnTop{display:flex;gap:8px;align-items:center;flex-wrap:wrap;pointer-events:auto}
#dino.coding #bsTop{display:none}
.dn-btn{background:#1d1b3d;color:var(--dn-ink);border:2px solid #4b4885;
  border-radius:10px;padding:8px 13px;font-family:var(--font-disp);font-size:13px;
  letter-spacing:1.2px;cursor:pointer;line-height:1.1;text-decoration:none}
.dn-btn:hover{background:#2a2757}
.dn-btn:focus-visible{outline:3px solid #7ab8ff;outline-offset:2px}
.dn-btn.ic{min-width:40px;padding:8px 10px;text-align:center}
#dnRun{color:#5dff7a;border-color:#5dff7a}
#dnRun.live{color:#ff6b6b;border-color:#ff6b6b}
#gameName{color:#ffe14d;font-family:'Space Mono',var(--font-disp),monospace;font-size:16px;letter-spacing:2px;margin-left:6px}
.bs-gap{flex:1}

/* IF … ELSE, drawn so it cannot be mistaken for a plain if */
#cPal .cblk.k-c2 .cpelse{flex-basis:100%;margin-top:2px;padding:2px 0 0 12px;
  border-top:2px dashed rgba(36,29,56,.35)}
#coder .celse{display:inline-block;background:var(--a);color:#241d38;font-weight:bold;
  font-size:12px;border-radius:6px;padding:2px 10px;margin:2px 0}

.dn-sorry{position:fixed;inset:0;display:grid;place-content:center;gap:10px;text-align:center;
  font-family:var(--font,system-ui);color:var(--dn-ink);background:var(--dn-paper);padding:24px;z-index:99}
.dn-sorry b{font-family:var(--font-disp,inherit);font-size:20px;letter-spacing:2px}
.dn-sorry small{font-size:13px;max-width:34ch}
@media (max-width:700px){ .dn-btn{padding:7px 10px;font-size:12px} #gameName{font-size:13px} }
</style>
</head>
<body>
<canvas id="view"></canvas>

<div id="dino">
  <div id="bsTop">
    <div id="dnTop">
      <a class="dn-btn ic" id="bsHome" href="index.html" aria-label="All games">⌂</a>
      <button class="dn-btn" id="dnOpen">▦ BLOCKS</button>
      <button class="dn-btn" id="dnRun">▶ RUN</button>
      <span id="gameName"></span>
      <span class="bs-gap"></span>
      <button class="dn-btn ic" id="dnLang">ES</button>
      <button class="dn-btn ic" id="dnReset" aria-label="Start over">↺</button>
    </div>
  </div>
</div>
<canvas id="hud"></canvas>

<div id="coder" class="hidden">
  <div id="cBar"></div>
  <div id="cObj"></div>
  <div id="cCoach" class="hidden"></div>
  <div id="tutor" class="hidden"></div>
  <div id="cPal"></div>
  <div id="cScript"></div>
</div>

<script src="lib/three.classic.js?v=9"></script>
<script src="strings.js?v=9"></script>
<script src="blocks.js?v=9"></script>
<script src="vm.js?v=9"></script>
<script src="coder.js?v=9"></script>
<script src="costumes.js?v=9"></script>
<script src="games.js?v=9"></script>
<script src="boot.js?v=9"></script>
</body>
</html>
