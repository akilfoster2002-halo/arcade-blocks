<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- ARCADE — the menu. Each card's little screen is drawn from the same
     sprites (costumes.js) and scenery (games.js) the game itself uses, in
     the machine's real pixels, so what you click is what you get. A card
     opens play.html?g=<id>. -->
<title>Arcade</title>
<meta name="description" content="Ten classic arcade games, every rule in blocks you can read. Pick one.">
<style>
@font-face{font-family:'Space Mono';src:url('fonts/spacemono-700.woff2') format('woff2');font-weight:700;font-display:swap}
:root{--paper:#0b0a1c;--ink:#f2f2ff;--dim:#8d8bb8;--card:#1a1838;--line:#4b4885;--gold:#ffe14d}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:'Space Mono',ui-monospace,Menlo,monospace}
header{display:flex;align-items:center;justify-content:center;padding:26px 16px 6px;position:relative}
#logo{image-rendering:pixelated;width:min(360px,70vw);height:auto}
.lang{position:absolute;right:16px;top:20px;background:var(--card);color:var(--ink);border:2px solid var(--line);
  border-radius:10px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.sub{text-align:center;color:var(--dim);margin:6px 0 22px;font-size:14px;letter-spacing:1px}
main{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px;max-width:1180px;margin:0 auto;padding:0 16px 40px}
a.card{display:grid;gap:8px;text-decoration:none;color:var(--ink);background:var(--card);border:2px solid var(--line);
  border-radius:16px;padding:10px 10px 12px;transition:transform .12s,border-color .12s}
a.card:hover,a.card:focus-visible{transform:translateY(-3px);border-color:var(--gold);outline:none}
a.card canvas{width:100%;height:210px;object-fit:contain;border-radius:10px;image-rendering:pixelated;display:block;background:#000}
.name{display:flex;align-items:center;gap:8px;font-size:15px;letter-spacing:1px;padding:0 4px}
.name b{color:var(--dim);font-size:12px;min-width:20px}
.name .go{margin-left:auto;color:#5dff7a}
</style>
</head>
<body>
<header><canvas id="logo"></canvas><button class="lang" id="lang">ES</button></header>
<p class="sub" id="sub">Pick a game.</p>
<main id="grid"></main>

<script src="strings.js?v=8"></script>
<script src="costumes.js?v=8"></script>
<script src="games.js?v=8"></script>
<script>
const C = COSTUMES.C, GAMES = ARCADE.GAMES;
let lang = 'en'; try{ lang = localStorage.getItem('arcade.lang')==='es' ? 'es' : 'en'; }catch(e){}

/* one card: the game's screen at the start, drawn in its own pixels */
function screen(g){
  const w=g.view.w, h=g.view.h, x0=-w/2, y1=h/2;
  const cv=document.createElement('canvas'); cv.width=w*8; cv.height=h*8;
  const c=cv.getContext('2d');
  c.fillStyle='#000'; c.fillRect(0,0,cv.width,cv.height);
  if(g.stars){ let s=9; const r=()=>{ s=(s*16807)%2147483647; return s/2147483647; };
    const cols=['#ff4040','#40ff40','#4080ff','#ffff40','#ffffff','#ff40ff'];
    for(let i=0;i<70;i++){ c.fillStyle=cols[i%6]; c.fillRect(Math.floor(r()*cv.width), Math.floor(r()*cv.height), 1, 1); } }
  if(g.scene) g.scene({ rect:(a,b,cc,d,col)=>{ c.fillStyle=col; c.fillRect(Math.round((a-x0)*8), Math.round((y1-d)*8), Math.round((cc-a)*8), Math.round((d-b)*8)); } });
  const sprite=(cid,x,y)=>{ const k=C[cid]; if(!k) return;
    COSTUMES.paint(c, cid, Math.round((x-x0)*8 - k.w/2), Math.round((y1-y)*8 - (k.h-(k.below||0)))); };
  g.cast.filter(a=>a.visible!==false).forEach(a=>sprite(a.shape, a.x, a.y));
  (g.thumb ? g.thumb() : []).forEach(([cid,x,y])=>sprite(cid,x,y));
  return cv;
}
const grid=document.getElementById('grid');
GAMES.forEach((g,i)=>{
  const a=document.createElement('a'); a.className='card'; a.href='play.html?g='+g.id;
  a.appendChild(screen(g));
  const n=document.createElement('div'); n.className='name';
  n.innerHTML=`<b>${i+1}</b>${g.name}<span class="go">▶</span>`;
  a.appendChild(n); grid.appendChild(a);
});
function render(){
  window.LANG=lang; document.documentElement.lang=lang;
  document.getElementById('lang').textContent = lang==='es' ? 'EN' : 'ES';
  document.getElementById('sub').textContent = lang==='es' ? 'Escoge un juego.' : 'Pick a game.';
  const lg=document.getElementById('logo'), c=lg.getContext('2d');
  lg.width=6*16*2; lg.height=16; c.clearRect(0,0,lg.width,lg.height);
  ARCADE.drawText(c, 'ARCADE', lg.width/2, 1, '#ffe14d', { s:2, align:'center' });
}
document.getElementById('lang').onclick=()=>{ lang = lang==='es' ? 'en' : 'es';
  try{ localStorage.setItem('arcade.lang',lang); }catch(e){} render(); };
render();
</script>
</body>
</html>
